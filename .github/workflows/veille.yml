name: Veille offres professeur de lettres

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Envoyer un message Telegram de test'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run scrape
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
      - name: Enregistrer les offres déjà vues
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seen.json
          git diff --cached --quiet || git commit -m 'chore: update veille state'
          git push
